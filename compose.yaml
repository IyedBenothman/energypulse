services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: energypulse
      POSTGRES_USER: energypulse_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energypulse_user -d energypulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/energypulse
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: